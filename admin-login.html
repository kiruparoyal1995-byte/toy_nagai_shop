
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Nagai Dry Fish Shop</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b3954, #0a6ebd);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 12px 35px #0003;
    }

    h1 {
      color: #0b3954;
      text-align: center;
      font-size: 25px;
    }

    p {
      text-align: center;
      color: #64748b;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #0a6ebd;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Admin Login</h1>
    <p>Nagai Dry Fish Shop</p>

    <form id="adminLoginForm">
      <label for="username">Admin Username</label>
      <input id="username" name="username"
             autocomplete="username" required>

      <label for="password">Admin Password</label>
      <input id="password" name="password"
             type="password" autocomplete="current-password" required>

      <button type="submit">Login</button>
      <p id="message" role="status"></p>
    </form>
  </main>

 
<script>
document.getElementById("adminLoginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.textContent = "Checking login...";

    try {
        const response = await fetch("https://toy-nagai-shop.onrender.com/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.message || "Login failed.";
            return;
        }

        message.textContent = "Login successful!";
        window.location.href = "admin.html";
    } catch (error) {
        message.textContent = "Server connection failed. Please try again.";
    }
});
</script>

</body>
</html>

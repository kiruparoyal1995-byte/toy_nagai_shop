
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nagai Dry Fish Shop - Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f2f7fb;
      color: #0b3954;
    }
    h1 { color: #0a6ebd; }
    .summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 24px 0;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
      flex: 1;
      min-width: 180px;
    }
    .card strong {
      display: block;
      font-size: 28px;
      margin-top: 10px;
    }
    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 12px;
      padding: 12px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th { background: #0a6ebd; color: white; }
    button {
      background: #0a6ebd;
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    #message { margin: 16px 0; }
  </style>
</head>
<body>
  <h1>Nagai Dry Fish Shop — Admin</h1>
  <p>Order Dashboard</p>
  <button onclick="loadOrders()">Refresh Orders</button>
  <p id="message">Loading orders...</p>

  <div class="summary">
    <div class="card">Total Orders<strong id="totalOrders">0</strong></div>
    <div class="card">Total Sales<strong id="totalSales">₹0</strong></div>
  </div>

  <h2>Customer Orders</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Items</th>
          <th>Total</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ordersTable"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://toy-nagai-shop.onrender.com/api/orders";

    async function loadOrders() {
      const message = document.getElementById("message");
      const table = document.getElementById("ordersTable");

      message.textContent = "Loading orders...";
      table.replaceChildren();

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("HTTP " + response.status);

        const orders = await response.json();

        document.getElementById("totalOrders").textContent = orders.length;
        document.getElementById("totalSales").textContent =
          "₹" + orders.reduce((sum, order) => sum + Number(order.total || 0), 0);

        for (const order of orders) {
          const row = document.createElement("tr");
          const itemNames = (order.items || []).map(item =>
            `${item.tamil || item.english || "Product"} × ${item.quantity || 1}`
          ).join(", ");

          const values = [
            order._id || "",
            order.customerName || "",
            order.phone || "",
            order.address || "",
            itemNames,
            "₹" + Number(order.total || 0),
            order.createdAt ? new Date(order.createdAt).toLocaleString("en-IN") : ""
          ];

          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          }
          table.appendChild(row);
        }

        message.textContent = orders.length
          ? "Orders loaded successfully."
          : "No orders found.";
      } catch (error) {
        message.textContent =
          "Could not load orders. Please check the API connection.";
        console.error(error);
      }
    }

    loadOrders();
  </script>
</body>
</html>

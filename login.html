
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Nagai Dry Fish Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      padding: 20px;
    }
    .login-box {
      max-width: 400px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #0B3954; text-align: center; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #0A6EBD;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>நாகை கருவாடு கடை</h1>
    <h2>Customer Login</h2>
    <form id="loginForm">
      <label for="mobile">Mobile Number</label>
      <input id="mobile" type="tel" required
             pattern="[6-9][0-9]{9}" maxlength="10">

      <label for="password">Password</label>
      <input id="password" type="password" required>

      <button type="submit">Login</button>
      <p id="loginMessage"></p>
    </form>
    <p><a href="register.html">Create an account</a></p>
    <p><a href="index.html">Back to Home</a></p>
  </main>
  <script src="login.js"></script>
</body>
</html>
